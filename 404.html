<!DOCTYPE html>
<!--
  404.html
  ========
  Pagina personalizada para URLs inexistentes.
  No debe aparecer en sitemap.xml.
-->
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagina no encontrada | Francisco Molina</title>
  <meta name="robots" content="noindex,follow">

  <!-- Tema antes del primer pintado -->
  <script>
    (() => {
      const saved = localStorage.getItem("portfolio-theme");
      document.documentElement.setAttribute("data-bs-theme", saved ?? "dark");
    })();
  </script>
  <link rel="shortcut icon" href="./assets/img/logo.webp" type="image/x-icon">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Estilos propios -->
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body>
  <!-- Skip link -->
  <a class="skip-link" href="#main-content">Saltar al contenido principal</a>

  <!-- Header / Navbar -->
  <header class="sticky-top border-bottom bg-body">
    <nav class="navbar navbar-expand-lg" aria-label="Navegacion principal">
      <div class="container">
        <a class="navbar-brand fw-bold" href="./">
          <img src="./assets/img/logo.webp" class="logo" alt="Francisco Molina">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Abrir navegacion">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <li class="nav-item">
              <a class="nav-link" href="./#projects">Proyectos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./#skills">Capacidades</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./#about">Sobre mi</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./#contact">Contacto</a>
            </li>
            <li class="nav-item ms-lg-2">
              <button id="themeToggle" class="btn btn-outline-secondary btn-sm" type="button" aria-label="Cambiar tema">
                <i id="themeIcon" class="bi bi-moon-stars"></i>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- Contenido principal -->
  <main id="main-content" class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <section class="text-center col-lg-7">
      <p class="display-1 fw-bold mb-0">404</p>
      <h1 class="h2">Pagina no encontrada</h1>
      <p class="text-body-secondary">
        La direccion no existe o el contenido fue movido.
      </p>
      <a class="btn btn-accent btn-lg" href="./">
        Volver al portafolio
      </a>
    </section>
  </main>

  <!-- Footer -->
  <footer class="border-top py-4">
    <div class="container d-flex flex-column flex-md-row gap-2 justify-content-between">
      <p class="mb-0 small text-body-secondary">
        &copy; <span data-current-year></span> Francisco Molina.
      </p>
      <nav class="d-flex flex-wrap gap-3 small" aria-label="Enlaces del pie">
        <a href="https://github.com/franciscomolinacl" target="_blank"><i class="bi bi-github"></i></a>
        <a href="https://www.linkedin.com/in/francisco-molina-cl/" target="_blank"><i class="bi bi-linkedin"></i></a>
        <a href="mailto:contacto@franciscomolina.cl"><i class="bi bi-envelope-fill"></i></a>
      </nav>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <!-- JS propios -->
  <script src="./assets/js/main.js" defer></script>
</body>
</html>
